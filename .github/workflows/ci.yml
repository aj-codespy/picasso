name: CI

# Runs the unit suite and CLI smoke on all three platforms.
# The suite is stdlib-only (providers are mocked in tests), so there is no
# install step and no network access required.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m py_compile designlib.py src/sync_data.py

      - name: Unit tests
        run: python -m unittest tests.test_designlib

      - name: CLI smoke (--version)
        run: python designlib.py --version

      - name: Launcher smoke (POSIX only)
        if: runner.os != 'Windows'
        run: ./picasso --version

      - name: Launcher smoke (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: picasso.cmd --version

      # B1 regression: the INSTALLED command (symlink on POSIX, shim copy on
      # Windows) must resolve the real launcher path, so running `picasso`
      # from a DIFFERENT cwd than the repo works. install.sh/install.bat
      # create that state; here we re-run --version from a fresh cwd.
      - name: Differential-cwd launcher smoke (POSIX install)
        if: runner.os != 'Windows'
        run: |
          ./install.sh
          export PATH="$HOME/.local/bin:$PATH"
          cd "$RUNNER_TEMP"
          picasso --version

      - name: Differential-cwd launcher smoke (Windows install)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          install.bat
          cd %RUNNER_TEMP%
          "%LOCALAPPDATA%\picasso\picasso.cmd" --version
